name: Bug report
description: Report incorrect behavior in the CMCI mock server.
title: "[Bug]: "
body:
  - type: textarea
    id: actual_behavior
    attributes:
      label: What happened?
      description: Describe the problem and the affected endpoint or client workflow.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the startup command or createApp options and the request or script that triggers the problem.
      placeholder: |
        1. Start the server with...
        2. Send this request...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: Describe the expected result. Link IBM or Zowe references if they help explain the expected CMCI behavior.
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node.js version
      description: Output of node --version.
      placeholder: v22.x.x
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the OS, mock server version or commit, and client or Zowe extension version when relevant.
  - type: textarea
    id: configuration
    attributes:
      label: Configuration
      description: Include relevant environment variables, createApp configuration, and custom fixtures.
      render: text
  - type: textarea
    id: request_response
    attributes:
      label: Request, response, or logs
      description: Include the exact HTTP request and response or relevant client errors.
      render: text
